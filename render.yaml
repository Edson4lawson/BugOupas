# Configuration Render Blueprint avec PostgreSQL
# Ce fichier permet un déploiement one-click sur Render

services:
  # Service Web PHP
  - type: web
    name: bugoupas-backend
    runtime: docker
    repo: https://github.com/Edson4lawson/BugOuPas
    branch: main
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bugoupas-postgres
          property: connectionString
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: RENDER
        value: "true"
    healthCheckPath: /health.php
    autoDeploy: true

databases:
  # Base de données PostgreSQL gratuite sur Render
  - name: bugoupas-postgres
    databaseName: bugoupas
    user: bugoupas
    plan: free
